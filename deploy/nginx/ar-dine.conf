# ==============================================================================
# AR-DINE Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream backend_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ar-dine.yourdomain.com api.ar-dine.yourdomain.com;

    # Redirect all plain HTTP traffic to TLS/HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ar-dine.yourdomain.com;

    # SSL TLS Certificates
    ssl_certificate /etc/letsencrypt/live/ar-dine.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ar-dine.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max upload body size for 25MB 3D models and 5MB dish photos
    client_max_body_size 30M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 1. Real-Time Server-Sent Events (SSE) Route
    # CRITICAL: Disable all proxy buffering and caching to allow instant event streaming
    location ~ ^/api/v1/restaurants/.+/events {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Disable buffering and cache for continuous streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Maintain long-lived connection without premature timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Remove connection header to enable HTTP/1.1 keep-alive
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend REST API Endpoints
    location /api/v1/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 3. Static Media Storage Delivery (when using local storage provider)
    location /storage/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 4. Next.js Static Optimization & Static Chunks
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Frontend Next.js App Router (Default)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
